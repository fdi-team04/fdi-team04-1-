services:
  pipeline:
    build: ./Quant
    working_dir: /app
    volumes: # 로컬 <-> 도커 컨테이너 (동기화)
      - ./Quant:/app   # config.yaml의 data_dir과 같은 경로
      - ./Quant/data:/content/data
      - hf-cache:/cache/hf      # FinBERT는 처음 한 번만 받음(?)
    env_file:
      - path: .env
        required: false         # .env 없어도 실행됨
    command: python run_all.py

volumes:
  hf-cache: